
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot reload. The venv lives at /opt/venv
      # (outside /app), so this mount does not shadow it.
      - ./backend:/app
    environment:
      # Makes the uvicorn --reload watcher pick up changes through the
      # Windows bind mount (inotify doesn't cross the host/VM boundary).
      WATCHFILES_FORCE_POLLING: "true"

  postgres:
    image: postgres:17-alpine
    container_name: notes-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: notes_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_admin -d notes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

